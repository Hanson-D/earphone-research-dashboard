name: Package dashboard

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare local package directory
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ROOT="dist/EarphoneDashboardLocal"
          APP_ROOT="$PACKAGE_ROOT/app"
          mkdir -p "$APP_ROOT" "$PACKAGE_ROOT/projects"

          cp headphone-dashboard-sample/打开耳机数据看板.bat "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/打开耳机数据看板.command "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/README_使用说明.txt "$PACKAGE_ROOT/"

          cp headphone-dashboard-sample/index.html "$APP_ROOT/"
          cp headphone-dashboard-sample/app.js "$APP_ROOT/"
          cp headphone-dashboard-sample/dashboard-core.js "$APP_ROOT/"
          cp headphone-dashboard-sample/server.py "$APP_ROOT/"
          cp headphone-dashboard-sample/server.html "$APP_ROOT/"
          cp headphone-dashboard-sample/server-entry.js "$APP_ROOT/"
          cp headphone-dashboard-sample/styles.css "$APP_ROOT/"
          cp headphone-dashboard-sample/headphone_sample.csv "$APP_ROOT/"
          cp -R headphone-dashboard-sample/photos "$APP_ROOT/photos"
          cp -R headphone-dashboard-sample/modules "$APP_ROOT/modules"

          chmod +x "$PACKAGE_ROOT/打开耳机数据看板.command"

      - name: Prepare server package directory
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ROOT="dist/EarphoneDashboardServer"
          mkdir -p "$PACKAGE_ROOT/projects"

          cp headphone-dashboard-sample/start-server.bat "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/start-server.command "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/start-server.sh "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/README_服务器版使用说明.txt "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/README.md "$PACKAGE_ROOT/"

          cp headphone-dashboard-sample/index.html "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/app.js "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/dashboard-core.js "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/server.py "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/server.html "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/server-entry.js "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/styles.css "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/headphone_sample.csv "$PACKAGE_ROOT/"
          cp -R headphone-dashboard-sample/photos "$PACKAGE_ROOT/photos"
          cp -R headphone-dashboard-sample/modules "$PACKAGE_ROOT/modules"

          chmod +x "$PACKAGE_ROOT/start-server.command"
          chmod +x "$PACKAGE_ROOT/start-server.sh"

      - name: Prepare auto-update launcher package directory
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ROOT="dist/EarphoneDashboardLauncher"
          mkdir -p "$PACKAGE_ROOT"

          cp headphone-dashboard-sample/launcher/启动耳机数据看板.bat "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/launcher/launcher.ps1 "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/launcher/launcher-config.example.json "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/launcher/latest.example.json "$PACKAGE_ROOT/"
          cp headphone-dashboard-sample/launcher/README_自动更新启动器.txt "$PACKAGE_ROOT/"

      - name: Prepare shared release directory package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          RELEASE_ROOT="dist/EarphoneDashboardRelease"
          VERSION_ROOT="$RELEASE_ROOT/versions/$VERSION"
          APP_ROOT="$VERSION_ROOT/app"
          mkdir -p "$APP_ROOT"

          cp headphone-dashboard-sample/index.html "$APP_ROOT/"
          cp headphone-dashboard-sample/app.js "$APP_ROOT/"
          cp headphone-dashboard-sample/dashboard-core.js "$APP_ROOT/"
          cp headphone-dashboard-sample/server.py "$APP_ROOT/"
          cp headphone-dashboard-sample/server.html "$APP_ROOT/"
          cp headphone-dashboard-sample/server-entry.js "$APP_ROOT/"
          cp headphone-dashboard-sample/styles.css "$APP_ROOT/"
          cp headphone-dashboard-sample/headphone_sample.csv "$APP_ROOT/"
          cp -R headphone-dashboard-sample/photos "$APP_ROOT/photos"
          cp -R headphone-dashboard-sample/modules "$APP_ROOT/modules"

          RELEASE_ROOT="$RELEASE_ROOT" VERSION="$VERSION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release_root = Path(os.environ["RELEASE_ROOT"])
          version = os.environ["VERSION"]
          payload = {
              "version": version,
              "path": rf"\\server\earphone-dashboard-release\versions\{version}",
              "entry": "app",
              "notes": f"Generated by GitHub Actions from {os.environ['GITHUB_SHA']}",
          }
          (release_root / "latest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          cat > "$RELEASE_ROOT/README_共享发布目录说明.txt" <<EOF
          耳机数据看板 - 共享发布目录包

          使用方式：

          1. 将 EarphoneDashboardRelease 目录中的 latest.json 和 versions 文件夹复制到共享目录。
             例如：\\\\server\\earphone-dashboard-release

          2. 如果共享目录不是 \\\\server\\earphone-dashboard-release，请修改 latest.json 中的 path。

          3. 用户端自动更新启动器会读取 latest.json，并复制 versions/$VERSION 到本机缓存后启动。
          EOF

      - name: Create zip archives
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -r earphone-dashboard-local.zip EarphoneDashboardLocal
          zip -r earphone-dashboard-server.zip EarphoneDashboardServer
          zip -r earphone-dashboard-launcher.zip EarphoneDashboardLauncher
          zip -r earphone-dashboard-release.zip EarphoneDashboardRelease

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: earphone-dashboard-packages
          path: |
            dist/earphone-dashboard-local.zip
            dist/earphone-dashboard-server.zip
            dist/earphone-dashboard-launcher.zip
            dist/earphone-dashboard-release.zip
          if-no-files-found: error
          overwrite: true

      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/earphone-dashboard-local.zip
            dist/earphone-dashboard-server.zip
            dist/earphone-dashboard-launcher.zip
            dist/earphone-dashboard-release.zip

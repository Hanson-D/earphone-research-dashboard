<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录耳机研究看板</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="server.css">
</head>
<body class="dashboard-login-page">
  <main class="dashboard-login-shell">
    <section class="panel dashboard-login-card">
      <p class="eyebrow">FIT RESEARCH / ACCESS</p>
      <h1>登录研究看板</h1>
      <p class="dashboard-login-intro">使用管理员分配的看板账号。登录后只会列出该账号获准访问的项目。</p>
      <form id="dashboardLoginForm" class="dashboard-login-form">
        <label>
          用户名
          <input id="dashboardUsername" name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label>
          密码
          <input id="dashboardPassword" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary-button" type="submit">登录</button>
      </form>
      <p id="dashboardLoginStatus" class="project-status" aria-live="polite"></p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>

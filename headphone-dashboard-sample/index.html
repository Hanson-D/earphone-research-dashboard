<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>耳机佩戴研究看板</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">FIT RESEARCH / 01</p>
      <h1>耳机佩戴研究看板</h1>
    </div>
    <div class="top-actions">
      <label class="file-button">
        导入 CSV
        <input id="csvInput" type="file" accept=".csv,text/csv">
      </label>
      <button id="resetButton" class="ghost-button">重置配置</button>
    </div>
  </header>

  <main>
    <section class="hero-grid">
      <aside class="control-panel">
        <div class="section-heading">
          <span>分析配置</span>
          <small id="dataSourceLabel">示例数据</small>
        </div>

        <div class="control-block split-control">
          <div>
            <label for="primaryDimension">主透视维度</label>
            <select id="primaryDimension"></select>
          </div>
          <div>
            <label for="secondaryDimension">组合维度</label>
            <select id="secondaryDimension"></select>
          </div>
        </div>

        <div class="control-block">
          <label for="metricSelect">主要分析指标</label>
          <select id="metricSelect"></select>
        </div>

        <div class="control-block">
          <label for="yAxisMode">柱状图 Y 轴范围</label>
          <select id="yAxisMode">
            <option value="adaptive">数据范围自适应</option>
            <option value="full">固定 0–10</option>
          </select>
        </div>

        <button id="clearGroupButton" class="primary-button">清除透视分组选择</button>
      </aside>

      <section class="analysis-area">
        <div id="kpiGrid" class="kpi-grid"></div>

        <div class="comparison-grid">
          <article class="panel pivot-panel">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">GROUP COMPARISON</p>
                <h2>透视分组</h2>
              </div>
              <span id="pivotHint" class="hint">点击分组查看详情</span>
            </div>
            <div class="table-scroll">
              <table class="pivot-table">
                <thead id="pivotHead"></thead>
                <tbody id="pivotBody"></tbody>
              </table>
            </div>
          </article>

          <article class="panel chart-panel">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">VISUAL SUMMARY</p>
                <h2 id="chartTitle">组间指标对比</h2>
              </div>
            </div>
            <div id="barChart" class="bar-chart"></div>
          </article>
        </div>
      </section>
    </section>

    <section class="detail-section">
      <div class="detail-heading">
        <div>
          <p class="panel-kicker">GROUP DRILL-DOWN</p>
          <h2 id="detailTitle">全部筛选数据</h2>
          <p id="detailDescription">点击上方任意透视分组，可查看该组原始记录与照片。</p>
        </div>
        <div id="groupStats" class="group-stats"></div>
      </div>

      <div class="detail-toolbar">
        <input id="detailSearch" type="search" placeholder="搜索当前组内的用户、设备或备注">
        <span id="detailCount"></span>
        <button id="clearColumnFilters" type="button" class="compact-button">清除表头筛选</button>
        <details class="layout-config">
          <summary>显示与布局</summary>
          <div class="layout-config-panel">
            <div class="display-settings">
              <label>
                表格字号
                <input id="fontSizeControl" type="range" min="10" max="18" step="1">
                <output id="fontSizeValue"></output>
              </label>
              <label>
                照片大小
                <input id="photoSizeControl" type="range" min="60" max="220" step="10">
                <output id="photoSizeValue"></output>
              </label>
              <button id="resetLayoutButton" type="button" class="compact-button">恢复默认布局</button>
            </div>
            <div class="column-config-heading">
              <strong>详情列配置</strong>
              <span>隐藏列、调整宽度，并使用箭头改变顺序</span>
            </div>
            <div id="columnConfigList" class="column-config-list"></div>
          </div>
        </details>
      </div>

      <div class="detail-table-wrap">
        <table class="detail-table">
          <colgroup id="detailColgroup"></colgroup>
          <thead id="detailHead"></thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <template id="emptyTemplate">
    <div class="empty-state">当前筛选条件下没有数据。</div>
  </template>

  <script src="app.js"></script>
</body>
</html>
